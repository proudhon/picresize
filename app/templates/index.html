<!DOCTYPE html>
<html>
<head>
  <title>Image Processor</title>
</head>
<body>
  <h1>Upload ZIP and Process</h1>
  <form method="POST" enctype="multipart/form-data">
    <label>ZIP file:</label>
    <input type="file" name="zipfile" required><br><br>

    <label>Canvas (e.g. 1800):</label>
    <input type="text" name="size" required><br><br>

    <label>Lato maggiore (e.g. 1550):</label>
    <input type="text" name="resize" required><br><br>

    <button type="submit">Start Processing</button>
  </form>
</body>
</html>
